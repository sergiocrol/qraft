# Netlify site config for the Astro client.
#
# Primary deploy path is the Makefile target `deploy-client-netlify`, which
# builds the workspace + client locally and uploads the finished dist/ via the
# Netlify CLI. This file declares the publish directory and cache headers so the
# result is correct whether it is deployed by CLI or (optionally) by Netlify's
# own git-connected build.
#
# WARNING: on the deployed site, THIS FILE IS NOT READ. Netlify resolves the
# config from the base directory, which is the repository root, so the settings
# that actually take effect live in /netlify.toml. You can see the difference
# on the live site: the /_astro/* rule below is not applied to it.
#
# It is kept because the CLI deploy path (`make deploy-client-netlify`) runs
# from this directory and does read it, and because it documents what the
# client wants. Anything here that must hold for the deployed site has to be
# duplicated in the root file — PUBLIC_API_URL="" is, deliberately, only there.
#
# NOTE: PUBLIC_API_URL is baked into the bundle at build time. For CLI deploys
# it comes from apps/client/.env; for git-connected builds it comes from the
# root netlify.toml. It must be empty in both, or the API proxy in
# public/_redirects is bypassed and the backend host leaks into the page.

[build]
  publish = "dist"

# Content-hashed assets (Astro emits these under /_astro/) never change contents
# for a given URL, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Un-hashed, stable-URL assets must be revalidated so a redeploy is picked up.
[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
